<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Status</title>
<style>
  :root {
    --running-color: #1b7f3e;
    --running-bg: #e6f4ea;
    --cancelled-color: #b3261e;
    --cancelled-bg: #fce8e6;
    --unknown-color: #5f6368;
    --unknown-bg: #f1f3f4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fafafa;
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 40px 32px;
    text-align: center;
  }

  .clinic-name {
    font-size: 16px;
    color: #5f6368;
    margin-bottom: 8px;
  }

  .session-name {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 28px;
  }

  .status-badge {
    display: inline-block;
    padding: 18px 32px;
    border-radius: 12px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.5px;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .status-badge.running {
    background: var(--running-bg);
    color: var(--running-color);
  }

  .status-badge.cancelled {
    background: var(--cancelled-bg);
    color: var(--cancelled-color);
  }

  .status-badge.unknown {
    background: var(--unknown-bg);
    color: var(--unknown-color);
  }

  .status-badge.info {
    background: #e8f0fe;
    color: #1a56db;
  }

  .session-info {
    margin-top: 12px;
    font-size: 14px;
    color: #5f6368;
    min-height: 20px;
  }

  .last-updated {
    margin-top: 20px;
    font-size: 13px;
    color: #80868b;
  }

  .refresh-note {
    margin-top: 4px;
    font-size: 12px;
    color: #9aa0a6;
  }

  .error-note {
    margin-top: 16px;
    font-size: 13px;
    color: var(--cancelled-color);
    display: none;
  }

  .upcoming-section {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid #eeeeee;
    text-align: left;
  }

  .upcoming-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: #80868b;
    margin-bottom: 12px;
    text-align: center;
  }

  .upcoming-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #f2f2f2;
  }

  .upcoming-item:last-child {
    border-bottom: none;
  }

  .upcoming-date-group {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .upcoming-date {
    font-size: 13px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .upcoming-meta {
    font-size: 12px;
    color: #80868b;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .upcoming-reason {
    display: block;
    font-size: 12px;
    font-style: italic;
    color: #b3261e;
    margin-top: 2px;
  }

  .upcoming-pill {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .upcoming-pill.running {
    background: var(--running-bg);
    color: var(--running-color);
  }

  .upcoming-pill.cancelled {
    background: var(--cancelled-bg);
    color: var(--cancelled-color);
  }

  .upcoming-pill.unknown {
    background: var(--unknown-bg);
    color: var(--unknown-color);
  }

  .upcoming-empty {
    font-size: 13px;
    color: #80868b;
    text-align: center;
    padding: 4px 0 2px;
  }

  #upcomingList {
    max-height: 320px;
    overflow-y: auto;
  }

  .today-multi-list {
    text-align: left;
  }

  .today-multi-list .upcoming-item:first-child {
    padding-top: 0;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="clinic-name">KCHC - Weller</div>
    <div class="session-name">Regional Lung Health Program<br>Group Session Status</div>

    <div id="statusBadge" class="status-badge unknown">Checking...</div>
    <div id="sessionInfo" class="session-info"></div>
    <div id="todayMultiLabel" class="upcoming-title" style="display:none; margin-top: 8px;">Today's Sessions</div>
    <div id="todayMultiList" class="today-multi-list" style="display:none;"></div>

    <div id="lastUpdated" class="last-updated"></div>
    <div class="refresh-note">Next check in <span id="countdown">60</span>s</div>
    <div id="errorNote" class="error-note">Unable to confirm status right now.<br>Please call the clinic at 613-542-2949 x1137 or x1182.</div>

    <div class="upcoming-section">
      <div class="upcoming-title">Upcoming Classes</div>
      <div id="upcomingList"></div>
    </div>
  </div>

<script>

  const SHEET_STATUS_URL = "https://script.google.com/macros/s/AKfycbx5OD2hf2GIDvwFNzfUf9_-B7WxBtYtmgeaIIxeAnWnxYbTabcoAUm6dpiP7Zb91GxH/exec";

  const badge = document.getElementById("statusBadge");
  const sessionInfoEl = document.getElementById("sessionInfo");
  const todayMultiLabel = document.getElementById("todayMultiLabel");
  const todayMultiList = document.getElementById("todayMultiList");
  const lastUpdatedEl = document.getElementById("lastUpdated");
  const errorNote = document.getElementById("errorNote");
  const countdownEl = document.getElementById("countdown");
  const upcomingListEl = document.getElementById("upcomingList");

  const REFRESH_SECONDS = 60;
  let secondsUntilNextCheck = REFRESH_SECONDS;
  let displayedStatus = null;
  let lastGoodUpdate = null;

  const CLINIC_PHONE_MESSAGE = "Unable to confirm status right now.<br>Please call the clinic at 613-542-2949 x1182 or x1137.";

  // Month spelled out to avoid MM/DD ambiguity
  function formatFullTimestamp(date) {
    const datePart = date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
    const weekdayPart = date.toLocaleDateString(undefined, { weekday: "long" });
    const timePart = date.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    return datePart + " (" + weekdayPart + ") at " + timePart;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch];
    });
  }

  function nowTimeString() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // One list-item row, shared by both the "multiple sessions today" list and the "upcoming classes list".
  function buildSessionItemHtml(item) {
    const statusUpper = (item.status || "").trim().toUpperCase();
    let pillClass = "unknown";
    let pillText = "Unconfirmed";
    if (statusUpper === "RUNNING") {
      pillClass = "running";
      pillText = "Running";
    } else if (statusUpper === "CANCELLED" || statusUpper === "CANCELED") {
      pillClass = "cancelled";
      pillText = "Cancelled";
    }

    const metaParts = [item.group, item.time].filter(Boolean).join(" · ");
    const reasonText = (item.reason || "").trim();
    const reasonLine = reasonText
      ? '<span class="upcoming-reason">' + escapeHtml(reasonText) + "</span>"
      : "";

    return '<div class="upcoming-item">' +
      '<div class="upcoming-date-group">' +
      '<span class="upcoming-date">' + escapeHtml(item.date) + "</span>" +
      '<span class="upcoming-meta">' + escapeHtml(metaParts) + "</span>" +
      reasonLine +
      "</div>" +
      '<span class="upcoming-pill ' + pillClass + '">' + pillText + "</span>" +
      "</div>";
  }

  function renderUpcoming(upcomingArr) {
    if (!upcomingArr || upcomingArr.length === 0) {
      upcomingListEl.innerHTML = '<div class="upcoming-empty">No upcoming classes scheduled.</div>';
      return;
    }
    upcomingListEl.innerHTML = upcomingArr.map(buildSessionItemHtml).join("");
  }

  // Big status display today: the big colored badge for a normal single-session day, a small pill list when multiple sessions land on the same date or the neutral "no classes" state when nothing is scheduled.
  function renderToday(sessions) {
    if (!sessions || sessions.length === 0) {
      badge.style.display = "";
      sessionInfoEl.style.display = "";
      todayMultiLabel.style.display = "none";
      todayMultiList.style.display = "none";

      applyNoSessionToday();
      lastGoodUpdate = new Date();
      lastUpdatedEl.textContent = "Checked at " + nowTimeString();
      return;
    }

    if (sessions.length === 1) {
      badge.style.display = "";
      sessionInfoEl.style.display = "";
      todayMultiLabel.style.display = "none";
      todayMultiList.style.display = "none";

      const s = sessions[0];
      const normalizedStatus = (s.status || "").trim().toUpperCase();
      displayedStatus = normalizedStatus;
      applyStatus(normalizedStatus);

      if (normalizedStatus === "RUNNING" || normalizedStatus === "CANCELLED" || normalizedStatus === "CANCELED") {
        lastGoodUpdate = new Date();
      }

      sessionInfoEl.textContent = [s.group, s.time].filter(Boolean).join(" · ");

      const noteValue = (s.reason || "").trim();
      lastUpdatedEl.textContent = noteValue
        ? "Note: " + noteValue + " · Checked at " + nowTimeString()
        : "Checked at " + nowTimeString();
      return;
    }

    // Multiple sessions today statuses
    badge.style.display = "none";
    sessionInfoEl.style.display = "none";
    errorNote.style.display = "none";
    todayMultiLabel.style.display = "";
    todayMultiList.style.display = "";

    todayMultiList.innerHTML = sessions.map(buildSessionItemHtml).join("");
    lastGoodUpdate = new Date();
    lastUpdatedEl.textContent = "Checked at " + nowTimeString();
  }

  function applyNoSessionToday() {
    badge.classList.remove("running", "cancelled", "unknown", "info");
    badge.textContent = "No Classes Scheduled Today";
    badge.classList.add("info");
    sessionInfoEl.textContent = "";
    errorNote.style.display = "none";
  }

  function applyStatus(rawStatus) {
    const status = (rawStatus || "").trim().toUpperCase();

    badge.classList.remove("running", "cancelled", "unknown", "info");

    if (status === "RUNNING") {
      badge.textContent = "Session Running";
      badge.classList.add("running");
      errorNote.style.display = "none";
    } else if (status === "CANCELLED" || status === "CANCELED") {
      badge.textContent = "Session Cancelled";
      badge.classList.add("cancelled");
      errorNote.style.display = "none";
    } else {
      badge.textContent = "Status Unavailable";
      badge.classList.add("unknown");
      let message = CLINIC_PHONE_MESSAGE;
      if (lastGoodUpdate) {
        message += "<br>Last confirmed update: " + formatFullTimestamp(lastGoodUpdate) + ".";
      }
      errorNote.innerHTML = message;
      errorNote.style.display = "block";
    }
  }

  async function fetchStatus() {
    if (SHEET_STATUS_URL.includes("PASTE_YOUR")) {
      applyStatus("");
      errorNote.style.display = "block";
      errorNote.textContent = "Status link not yet configured. Add your Apps Script Web App URL in this file.";
      return;
    }

    try {
      const response = await fetch(SHEET_STATUS_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!response.ok) throw new Error("Network response was not ok");

      const data = await response.json();

      renderToday(data.todaySessions || []);
      renderUpcoming(data.upcoming || []);

    } catch (err) {
      badge.style.display = "";
      sessionInfoEl.style.display = "";
      todayMultiLabel.style.display = "none";
      todayMultiList.style.display = "none";
      applyStatus("");
    } finally {
      secondsUntilNextCheck = REFRESH_SECONDS;
      countdownEl.textContent = secondsUntilNextCheck;
    }
  }

  fetchStatus();
  secondsUntilNextCheck = REFRESH_SECONDS;
  countdownEl.textContent = secondsUntilNextCheck;

  // Single 1-second tick to drive both the visible countdown and the fetch trigger.
  setInterval(() => {
    secondsUntilNextCheck = Math.max(0, secondsUntilNextCheck - 1);
    countdownEl.textContent = secondsUntilNextCheck;

    if (secondsUntilNextCheck === 0) {
      fetchStatus();
    }
  }, 1000);
</script>

</body>
</html>
